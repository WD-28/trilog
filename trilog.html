<style>
/* TriLog 2 · Gestaltung
   Idee: ein Logbuch auf warmem Papier. Jede Disziplin bringt ihre Farbe mit,
   jede Seite beginnt mit einer farbigen Kopfzone und erzählt dann in Kapiteln. */
:root{
  /* Sepia (Standard hell) */
  --bg:#F3ECE0;--bg2:#EFE6D7;--card:#FBF7F0;--fill:#F1E9DC;--track:#E6DCCB;--neutral:#CDBFA8;
  --ink:#2A231B;--ink2:#594D3F;--ink3:#6B5F4F;--line:rgba(70,50,20,.11);
  --c-swim:#2A8BC0;--c-bike:#D5702A;--c-run:#2A8659;--c-tri:#E3A430;--c-other:#A89A84;
  --t-swim:#15607F;--t-bike:#8A4410;--t-run:#186040;--t-tri:#7A5300;
  --h-swim:#1E6E99;--h-bike:#B4581C;--h-run:#1F6E48;--h-tri:#2A231B;
  --warn:#C8322A;--warn-t:#B42318;--warn-bg:#F8E3DD;--warn-bg2:#F2C9BF;--warn-bg3:#E9A597;
  --ok:#2A8659;--amber:#C88A1A;
  --shadow:0 0 0 1px rgba(70,50,20,.05),0 1px 2px rgba(70,50,20,.05),0 14px 34px -22px rgba(70,45,10,.30);
  --shadow-h:0 0 0 1px rgba(70,50,20,.07),0 2px 4px rgba(70,50,20,.06),0 22px 44px -22px rgba(70,45,10,.38);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --disp:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.9,.25,1);--spring:cubic-bezier(.34,1.26,.5,1);
  --acc:var(--c-tri);--acc-t:var(--t-tri);--hero:var(--h-tri);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14110D;--bg2:#1A1611;--card:#201B15;--fill:#28221A;--track:#342C22;--neutral:#55493A;
  --ink:#F3ECE0;--ink2:#CBBFAE;--ink3:#A99C89;--line:rgba(255,240,215,.09);
  --t-swim:#86CDF0;--t-bike:#F4B07C;--t-run:#7ED6A7;--t-tri:#F5CD72;
  --h-swim:#15506F;--h-bike:#8A4413;--h-run:#165238;--h-tri:#0E0C09;
  --warn:#FF6B5F;--warn-t:#FF8A80;--warn-bg:#3B1C18;--warn-bg2:#57251F;--warn-bg3:#7A3027;
  --shadow:0 0 0 1px rgba(255,240,215,.05),0 14px 34px -22px rgba(0,0,0,.7);--shadow-h:0 0 0 1px rgba(255,240,215,.08),0 22px 44px -22px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14110D;--bg2:#1A1611;--card:#201B15;--fill:#28221A;--track:#342C22;--neutral:#55493A;
  --ink:#F3ECE0;--ink2:#CBBFAE;--ink3:#A99C89;--line:rgba(255,240,215,.09);
  --t-swim:#86CDF0;--t-bike:#F4B07C;--t-run:#7ED6A7;--t-tri:#F5CD72;
  --h-swim:#15506F;--h-bike:#8A4413;--h-run:#165238;--h-tri:#0E0C09;
  --warn:#FF6B5F;--warn-t:#FF8A80;--warn-bg:#3B1C18;--warn-bg2:#57251F;--warn-bg3:#7A3027;
  --shadow:0 0 0 1px rgba(255,240,215,.05),0 14px 34px -22px rgba(0,0,0,.7);--shadow-h:0 0 0 1px rgba(255,240,215,.08),0 22px 44px -22px rgba(0,0,0,.8);color-scheme:dark}
:root[data-sport="swim"]{--acc:var(--c-swim);--acc-t:var(--t-swim);--hero:var(--h-swim)}
:root[data-sport="bike"]{--acc:var(--c-bike);--acc-t:var(--t-bike);--hero:var(--h-bike)}
:root[data-sport="run"]{--acc:var(--c-run);--acc-t:var(--t-run);--hero:var(--h-run)}
:root[data-sport="tri"],:root[data-sport="multi"]{--acc:var(--c-tri);--acc-t:var(--t-tri);--hero:var(--h-tri)}
:root{--acc-bg:color-mix(in srgb,var(--acc) 15%,var(--card));--acc-bg2:color-mix(in srgb,var(--acc) 34%,var(--card));
  --r1:color-mix(in srgb,var(--acc) 22%,var(--card));--r2:color-mix(in srgb,var(--acc) 42%,var(--card));--r3:color-mix(in srgb,var(--acc) 62%,var(--card));--r4:color-mix(in srgb,var(--acc) 82%,var(--card));--r5:var(--acc)}

*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;transition:background-color .5s ease}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc-t);outline-offset:2px;border-radius:10px}
.press{transition:transform .06s ease}
.press:active{transform:scale(.97)}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--disp);font-weight:700;letter-spacing:-.035em;line-height:1}
.ts{display:inline-block;width:.2em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink2)}
.sub{color:var(--ink3);font-size:13px;margin:2px 0 0}
.kick{color:var(--ink3);font-size:12.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px;display:flex;align-items:center;gap:6px}
.foot{color:var(--ink3);font-size:12px;margin:12px 0 0}
.ic{flex:none;display:block}

/* ---------- Kopfzeile ---------- */
.top{position:sticky;top:0;z-index:40;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px)}
.brand{display:flex;align-items:center;gap:9px}
.mark{display:inline-flex;gap:3px;align-items:flex-end;height:22px}
.mark i{display:block;width:6px;border-radius:3px}
.mark i:nth-child(1){height:12px}.mark i:nth-child(2){height:22px}.mark i:nth-child(3){height:17px}
.mark.big{height:56px;gap:7px;margin:4px 0 14px}.mark.big i{width:15px;border-radius:8px}.mark.big i:nth-child(1){height:30px}.mark.big i:nth-child(2){height:56px}.mark.big i:nth-child(3){height:42px}
.wm{font-family:var(--disp);font-size:20px;letter-spacing:-.02em;font-weight:500}
.wm b{font-weight:750}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.bkbtn{position:relative;width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink2)}
.bkbtn .bdot{position:absolute;top:6px;right:6px}
.bdot{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px var(--card);flex:none}
.bdot.ok{background:var(--ok)}.bdot.due{background:var(--amber)}.bdot.none{background:var(--neutral)}
.dtabs{display:none}
.s-swim{background:var(--c-swim)}.s-bike{background:var(--c-bike)}.s-run{background:var(--c-run)}.s-tri{background:var(--c-tri)}.s-other{background:var(--c-other)}.s-t1,.s-t2{background:var(--neutral)}

/* Kapitel-Leiste (Handy) */
.chap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:39;display:flex;gap:6px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none;background:linear-gradient(var(--bg) 70%,transparent);margin:0 -16px}
.chap::-webkit-scrollbar{display:none}
.chap a{flex:none;height:32px;display:inline-flex;align-items:center;padding:0 13px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none;transition:background .25s,color .25s}
.chap a.on{background:var(--acc);color:#fff}
:root[data-sport="tri"] .chap a.on,:root[data-sport="multi"] .chap a.on{color:#2A1E00}
/* Inhaltsverzeichnis (PC) */
.toc{display:none}

/* Segmente */
.seg{display:inline-flex;padding:3px;border-radius:99px;background:var(--track);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:30px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--ink3);white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(40,25,5,.14)}
.seg.wide{display:flex}.seg.wide button{flex:1}
.seg.light{background:rgba(255,255,255,.16)}
.seg.light button{color:rgba(255,255,255,.78)}
.seg.light button.on{background:#fff;color:var(--hero)}
.period button{height:28px;padding:0 10px;font-size:12.5px}

/* ---------- Seite ---------- */
.shell{max-width:1240px;margin:0 auto;padding:0 16px}
.wrap{padding:4px 0 calc(110px + env(safe-area-inset-bottom,0px));min-width:0}
#view{display:flex;flex-direction:column;gap:0;min-width:0}
.enter #view>*{animation:rise .55s var(--ease) both}
@keyframes rise{from{opacity:.001;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Kopfzone */
.hero{position:relative;border-radius:30px;overflow:hidden;color:#fff;padding:22px 20px 14px;background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 92%,#fff) 0%,var(--hero) 78%);isolation:isolate;box-shadow:0 30px 60px -36px color-mix(in srgb,var(--hero) 80%,transparent);transition:background .5s ease}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(520px 320px at 0% 0%,rgba(255,255,255,.22),transparent 70%),radial-gradient(520px 340px at 100% 100%,rgba(0,0,0,.28),transparent 70%)}
.hero::after{content:"";position:absolute;z-index:-1;width:170%;height:140px;left:-35%;top:24%;transform:rotate(-12deg);background:linear-gradient(180deg,transparent,rgba(255,255,255,.07),transparent);filter:blur(10px)}
:root[data-sport="tri"] .hero,:root[data-sport="multi"] .hero{background:linear-gradient(150deg,#4A3B27 0%,var(--hero) 80%)}
.hero .hk{color:rgba(255,255,255,.78);font-size:12.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero h1{margin:8px 0 0;font-family:var(--disp);font-size:34px;font-weight:750;letter-spacing:-.035em;line-height:1.05;text-wrap:balance}
.hero h1 .dot{color:var(--acc)}
:root[data-sport="swim"] .hero h1 .dot,:root[data-sport="bike"] .hero h1 .dot,:root[data-sport="run"] .hero h1 .dot{color:rgba(255,255,255,.55)}
.hero .hlead{margin:8px 0 0;font-size:15px;color:rgba(255,255,255,.86);max-width:52ch}
.hstats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px}
.hstats div{min-width:0}
.hstats .big{font-size:30px;display:block}
.hstats .big small{font-size:14px;font-weight:600;opacity:.7;letter-spacing:0;margin-left:3px}
.hstats span.l{font-size:12px;color:rgba(255,255,255,.75)}
.hmain .big{font-size:56px}
.hmain .big small{font-size:18px}
.hctl{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.hctl .lab{font-size:12px;color:rgba(255,255,255,.75)}
.sky{display:block;width:100%;margin-top:8px;overflow:visible}
.skynote{font-size:11.5px;color:rgba(255,255,255,.7);margin:2px 0 4px}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;background:rgba(255,255,255,.14);font-size:12.5px;font-weight:600;color:#fff}
.hchip.warnh{background:rgba(255,255,255,.92);color:var(--warn-t)}

/* Kapitel */
.sec{padding-top:42px;min-width:0;scroll-margin-top:120px}
.sech{display:flex;align-items:flex-end;gap:12px;margin:0 4px 16px;flex-wrap:wrap}
.sech>div{flex:1;min-width:0}
.sech h2{margin:0;font-family:var(--disp);font-size:24px;font-weight:750;letter-spacing:-.03em;line-height:1.15;display:flex;align-items:center;gap:10px}
.sech h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--acc);flex:none}
.sech p{margin:6px 0 0;color:var(--ink2);font-size:14px;max-width:70ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px;min-width:0;transition:box-shadow .3s,transform .3s var(--ease)}
.card.soft{background:transparent;box-shadow:none;padding:4px}
.card.tint{background:var(--acc-bg);box-shadow:none}
.card.flash{animation:flash 1.3s var(--ease)}
@keyframes flash{25%{box-shadow:0 0 0 3px var(--acc),var(--shadow)}}
.ch{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.chw{min-width:0;flex:1}
.cht{display:flex;align-items:center;gap:6px}
.ch h3{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
.chr{flex:none}
.ibtn{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink3);flex:none}
.ibtn:hover{background:var(--fill);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;background:var(--fill);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.acc{background:var(--acc-bg);color:var(--acc-t)}
.chip.warnc{background:var(--warn-bg);color:var(--warn-t)}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 15px;border-radius:99px;background:var(--fill);font-size:14px;font-weight:600;color:var(--ink)}
.tbtn.primary{background:var(--ink);color:var(--card)}
.tbtn.small{min-height:32px;padding:0 12px;font-size:13px}
.tbtn.danger{color:var(--warn-t);background:var(--warn-bg);margin-top:14px}
.tbtn.danger.arm{background:var(--warn);color:#fff}
.tbtn:disabled{opacity:.45;cursor:not-allowed}

/* Kacheln */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.t4{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--fill);border-radius:16px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:4px;position:relative}
.tile .l{font-size:12px;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:2px}
.tile .l .ibtn{width:22px;height:22px}
.tile .v{font-family:var(--disp);font-size:21px;font-weight:700;letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}
.tile .v.sm{font-size:16px}
.tile .n{font-size:11.5px;color:var(--ink3)}
.tile.warn{background:var(--warn-bg)}.tile.warn .v{color:var(--warn-t)}
.tile .new{position:absolute;top:8px;right:8px;height:20px;font-size:10.5px;padding:0 7px}

/* ---------- Befund ---------- */
.reveal{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding:20px;position:relative;overflow:hidden}
.reveal::before{content:"";position:absolute;right:-80px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,var(--acc-bg2),transparent 70%);opacity:.7;pointer-events:none}
.bmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
.spark{width:30px;height:30px;border-radius:10px;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
:root[data-sport="tri"] .spark,:root[data-sport="multi"] .spark{color:#2A1E00}
.spark.risk{background:var(--warn)!important;color:#fff!important}
.bh{margin:14px 0 8px;font-family:var(--disp);font-size:28px;font-weight:750;letter-spacing:-.035em;line-height:1.12;text-wrap:balance;position:relative}
.bh .pt{color:var(--acc-t)}
.bh.risk .pt{color:var(--warn-t)}
.bs{margin:0 0 16px;color:var(--ink2);position:relative}
.bst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bst>div{display:flex;flex-direction:column;gap:5px;min-width:0}
.bst .big{font-size:24px;overflow-wrap:anywhere}
.bst .n{font-size:11.5px;color:var(--ink3)}
details.way{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
details.way summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--acc-t)}
details.way summary::-webkit-details-marker{display:none}
details.way ol{margin:10px 0 0;padding-left:18px;color:var(--ink2);font-size:13.5px}
details.way li{margin:6px 0}
.rvchart{min-width:0;align-self:center}
.rvchart .cap{font-size:12.5px;color:var(--ink3);font-weight:600;margin-bottom:4px}

/* Beobachtungen */
.igrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:14px}
.ins{text-align:left;display:flex;flex-direction:column;gap:6px;width:100%;position:relative;overflow:hidden}
.ins::after{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--acc);opacity:.9}
.ins.risk::after{background:var(--warn)}
.ins:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.ins .it{display:flex;align-items:center;gap:8px}
.isq{width:32px;height:32px;border-radius:10px;background:var(--acc-bg);color:var(--acc-t);display:grid;place-items:center;flex:none}
.isq.risk{background:var(--warn-bg);color:var(--warn-t)}
.ins .cat{font-size:11.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em}
.ins .chip{margin-left:auto}
.ins .iv{font-size:28px;margin-top:4px}
.ins.risk .iv{color:var(--warn-t)}
.ins h4{margin:2px 0 0;font-size:16px;font-weight:650;letter-spacing:-.01em}
.ins p{margin:0;color:var(--ink2);font-size:13.5px}
.ins .bl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}

/* ---------- Race Day ---------- */
.rd{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.rh{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.rh>div:first-child{flex:1;min-width:0}
.rh h3{margin:0;font-family:var(--disp);font-size:22px;font-weight:750;letter-spacing:-.03em;line-height:1.15}
.cd{text-align:center;background:var(--acc-bg);border-radius:16px;padding:8px 12px;min-width:66px}
.cd .big{font-size:28px;display:block;color:var(--acc-t)}
.cd span:last-child{font-size:11.5px;color:var(--acc-t);font-weight:600}
.dist{font-size:12.5px;color:var(--ink3);margin:8px 2px 0}
.chance{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.chance .big{font-size:64px;color:var(--acc-t)}
.chance .big small{font-size:.42em;color:var(--ink3);margin-left:2px}
.chance .w{font-size:14px;color:var(--ink2);padding-bottom:8px}
.chance .w b{color:var(--ink)}
.play{background:var(--fill);border-radius:20px;padding:14px;margin-top:14px}
.zrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 2px 6px;font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
.zrow .big{font-size:28px;color:var(--ink)}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:34px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--acc) var(--p,50%),var(--track) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 3px 8px rgba(40,25,5,.3)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--track)}
input[type=range]::-moz-range-progress{height:6px;border-radius:99px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(40,25,5,.3)}
.wf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.wf div{background:var(--card);border-radius:14px;padding:10px 12px}
.wf span{font-size:11.5px;color:var(--ink3);display:block}
.wf b{font-size:17px;font-weight:650;letter-spacing:-.02em}
.how h4{margin:0 0 6px;font-size:14px;font-weight:650}
.hrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.hrow .hi{width:32px;height:32px;border-radius:11px;background:var(--fill);color:var(--ink2);display:grid;place-items:center;flex:none}
.hrow .hi.c-swim{background:color-mix(in srgb,var(--c-swim) 18%,var(--card));color:var(--t-swim)}
.hrow .hi.c-bike{background:color-mix(in srgb,var(--c-bike) 18%,var(--card));color:var(--t-bike)}
.hrow .hi.c-run{background:color-mix(in srgb,var(--c-run) 18%,var(--card));color:var(--t-run)}
.hrow .hn{min-width:0;flex:1}
.hrow .hn b{font-size:14px;font-weight:600;display:block}
.hrow .hn span{font-size:12px;color:var(--ink3)}
.hrow .hv{font-weight:650;font-size:15px;white-space:nowrap;padding-left:8px}
.rdbox{background:var(--acc-bg);border-radius:16px;padding:12px 14px;margin-top:10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;color:var(--acc-t);font-weight:650;font-size:13px}
.rdbox .big{font-size:28px;color:var(--acc-t)}
.split{display:flex;gap:3px;height:12px;border-radius:7px;overflow:hidden;margin:12px 0 4px}
.split i{display:block;height:100%;min-width:4px;transition:flex-grow .4s var(--ease)}
.split i.miss{opacity:.25}
details.part{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.part summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:650;color:var(--acc-t)}
details.part summary::-webkit-details-marker{display:none}
.prow2{margin-top:10px}
.prow2 .zrow{margin-bottom:0}
.prow2 .zrow b{font-size:15px;color:var(--ink)}
.fuel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}

/* ---------- Diagramme ---------- */
.chost{position:relative;min-width:0}
.chart{display:block;overflow:visible}
.chart text{font-family:var(--font)}
.ax{font-size:10.5px;fill:var(--ink3);font-variant-numeric:tabular-nums}
.lbl{font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums}
.gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.gwrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gaugeh{width:170px;flex:none}
.gauge{width:100%;display:block}
.gtext{display:flex;flex-direction:column;gap:4px}
.gtext .l{font-size:12.5px;color:var(--ink3);font-weight:600;display:flex;align-items:center}
.gtext .big{font-size:34px}
.gtext .w{font-size:13px;font-weight:650;color:var(--acc-t)}
.htop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.htop .big{font-size:32px}
.zbar{display:flex;gap:2px;height:36px;border-radius:12px;overflow:hidden;margin:4px 0 12px}
.zbar i{display:block;height:100%}
.zleg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;font-size:11.5px;color:var(--ink3)}
.zleg span{display:flex;align-items:center;gap:4px}
.zleg i{width:8px;height:8px;border-radius:2px;display:inline-block}
.zleg b{display:block;color:var(--ink);font-size:13.5px;margin:2px 0}
.zleg em{font-style:normal;display:block;overflow-wrap:anywhere}
.subh{font-size:12.5px;color:var(--ink3);font-weight:650;margin:10px 0 2px}
.hbar{display:grid;grid-template-columns:minmax(80px,auto) minmax(0,1fr) auto;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.hbar span{color:var(--ink2)}
.hbar .track{height:10px}
.hbar b{font-weight:650;white-space:nowrap}
.track{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .8s var(--ease)}
.track i.warn{background:var(--amber)}.track i.due{background:var(--warn)}
.f-swim{background:var(--c-swim)!important}.f-bike{background:var(--c-bike)!important}.f-run{background:var(--c-run)!important}
.track i.ghost{background:var(--neutral)}
.tip{position:fixed;z-index:200;pointer-events:none;background:rgba(30,24,16,.95);color:#fff;border-radius:12px;padding:8px 11px;font-size:12.5px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:260px}
.tip.on{opacity:1;transform:none}
.tip .d{font-size:11px;color:rgba(255,255,255,.65);margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:7px;margin-top:2px}
.tip .r i{width:9px;height:3px;border-radius:2px;flex:none}
.tip .r b{font-weight:650}.tip .r span{color:rgba(255,255,255,.65)}

/* Balance */
.balg{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.bal{background:var(--fill);border-radius:18px;padding:14px}
.balh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.balh b{font-size:15px}
.balh .n{font-size:12.5px;color:var(--ink3)}
.balh .chip{margin-left:auto}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.balb{display:grid;grid-template-columns:86px minmax(0,1fr) 44px;align-items:center;gap:10px;margin:6px 0;font-size:12.5px;color:var(--ink3)}
.balb b{text-align:right;color:var(--ink);font-weight:650}
.bal.lim{box-shadow:inset 0 0 0 2px var(--warn-bg2)}
.bal.lim .balh b{color:var(--warn-t)}
.balnote{font-size:13px;color:var(--ink2);margin:0 0 12px}

/* Zeitleiste Saison */
.tl{position:relative;padding:18px 0 4px}
.tl .bar{height:6px;border-radius:3px;background:var(--track);position:relative}
.tl .now{position:absolute;top:-6px;width:2px;height:18px;background:var(--ink);border-radius:1px}
.tl .rc{position:absolute;top:-9px;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;box-shadow:0 0 0 3px var(--card)}
.tl .rl{position:absolute;top:22px;transform:translateX(-50%);font-size:11.5px;color:var(--ink2);white-space:nowrap;text-align:center}
.phase{display:flex;gap:4px;margin-top:46px;border-radius:10px;overflow:hidden}
.phase i{height:30px;display:grid;place-items:center;font-size:11px;font-weight:650;font-style:normal;color:var(--ink2);background:var(--fill)}
.phase i.on{background:var(--acc);color:#fff}
:root[data-sport="tri"] .phase i.on{color:#2A1E00}
.racelist{display:flex;flex-direction:column;margin-top:14px}
.racelist .r{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.racelist .r>div{flex:1;min-width:0}.racelist b{display:block;font-size:14px}.racelist span{font-size:12px;color:var(--ink3)}

/* Plan */
.prow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px}
.prow+.prow{margin-top:2px}
.prow.today{box-shadow:inset 3px 0 0 var(--acc)}
.prow.chg{background:var(--acc-bg)}
.pday{width:42px;flex:none}
.pday b{display:block;font-size:14px}
.pday span{font-size:11.5px;color:var(--ink3)}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pl{font-size:14px}
.old{font-size:13px;color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--acc-t)}
.new{font-size:14px}
.ist{font-size:12px;color:var(--ink3)}
.circ{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--neutral);display:grid;place-items:center;flex:none}
.circ.done{background:var(--acc);border-color:var(--acc);color:#fff}
.fix{margin-top:12px;border-radius:16px;padding:14px;background:var(--acc-bg)}
.fix h4{margin:0;display:flex;align-items:center;gap:8px;font-size:15px}
.fix p{margin:8px 0 0;color:var(--ink2);font-size:13.5px}
.fix .keep{color:var(--ink);font-weight:550}
.need{background:var(--fill);border-radius:16px;padding:14px}
.needh{display:flex;align-items:center;gap:8px;color:var(--acc-t)}
.need p{margin:6px 0 0;color:var(--ink2);font-size:13.5px}
.prog{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--acc)}
.need .n{font-size:12px;color:var(--ink3)}
.pred{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px}
.pred+.pred{border-top:1px solid var(--line)}
.pred.me{background:var(--acc-bg);border-top-color:transparent}
.pred>div:first-child{flex:1;min-width:0}
.pred b{display:block;font-size:14.5px}
.pred span{font-size:12px;color:var(--ink3)}
.pred.me span{color:var(--ink2)}
.pv{text-align:right}
.pv .big{font-size:22px;display:block}
.recs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gearrow{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.gearrow:first-child{border-top:0}
.gearrow .gh{display:flex;align-items:center;gap:8px}
.gearrow .gh b{font-size:14.5px}
.gearrow .gh span{font-size:12px;color:var(--ink3)}
.gearrow .gh .chip{margin-left:auto}
.gearrow .gs{font-size:12px;color:var(--ink3);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lwrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.log{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
table.log th{text-align:left;font-size:11.5px;color:var(--ink3);font-weight:650;padding:8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
table.log td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
table.log .num{text-align:right}
table.log td.nm{max-width:180px;overflow:hidden;text-overflow:ellipsis}
table.log select{height:30px;border-radius:9px;border:1px solid var(--line);background:var(--fill);padding:0 6px;font-size:12.5px;max-width:150px}
.more{margin-top:12px}

/* ---------- Mehr ---------- */
.mhead{padding:18px 4px 4px}
.mhead h1{margin:0;font-family:var(--disp);font-size:34px;font-weight:750;letter-spacing:-.035em}
.drop{margin-top:14px;border:2px dashed var(--neutral);border-radius:18px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;cursor:pointer;color:var(--ink2)}
.drop b{color:var(--ink);font-size:15px}
.drop span{font-size:13px}
.drop.over{border-color:var(--acc);background:var(--acc-bg)}
.backup{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.bk{display:flex;align-items:center;gap:10px}
.bk b{display:block}.bk span{font-size:12.5px;color:var(--ink3)}
.brow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.form{display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.fl{font-size:12.5px;font-weight:650;color:var(--ink2);display:flex;align-items:center;gap:2px}
.fl .ibtn{width:22px;height:22px}
.fh{font-size:11.5px;color:var(--ink3)}
.fh.okh{color:var(--t-run)}
.fh.errh{color:var(--warn-t);font-weight:600}
.field.err input{border-color:var(--warn);background:var(--warn-bg)}
.field input,.field select,.pentry input,.pentry select{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--fill);padding:0 12px;font-size:15px;min-width:0;width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--acc)}
.toggles{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.tog{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--fill)}
.tog b{display:block;font-size:14.5px}.tog span{font-size:12.5px;color:var(--ink3)}
.tog>div{flex:1;min-width:0}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--neutral);transition:background .2s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.sw input:checked+i{background:var(--c-run)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--acc-t);outline-offset:2px}
.raceform,.gearform{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.raceform h4,.gearform h4{margin:0;font-size:15px}
.race{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.race>div{flex:1;min-width:0}.race b{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.race span{font-size:12.5px;color:var(--ink3)}
.race.past{opacity:.55}
.plan-ed{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.pday-ed{background:var(--fill);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pentry{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px;gap:6px;align-items:center}
.pentry>:nth-child(1){grid-area:1/1}.pentry>:nth-child(2){grid-area:1/2}.pentry>input{grid-area:2/1}.pentry>:nth-child(4){grid-area:2/2}.pentry>button{grid-area:1/3/3/4}
.pentry>select:first-child:nth-last-child(2){grid-area:1/1/2/3}
.pentry input,.pentry select{height:38px;padding:0 8px;font-size:14px;background:var(--card)}
.pday-ed .tbtn{align-self:flex-start}
.gl-item{border-top:1px solid var(--line);padding:10px 0}
.gl-item summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.gl-item summary::-webkit-details-marker{display:none}
.gl-item[open] summary svg{transform:rotate(90deg)}
.gl-item p{margin:6px 0 0;color:var(--ink2);font-size:13.5px}
.emptyc{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:20px}
.emptyc p{margin:0;color:var(--ink2)}
.pwrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.pwrow .l{font-size:12.5px;font-weight:650;color:var(--ink3);display:flex;align-items:center}

/* ---------- Tab-Leiste, Erinnerung, Toast, Blatt, Onboarding ---------- */
.tabbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:50;height:64px;border-radius:24px;background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(20px);backdrop-filter:saturate(1.5) blur(20px);box-shadow:0 10px 30px -12px rgba(40,25,5,.4),0 0 0 1px var(--line);display:flex;padding:5px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:19px;font-size:10.5px;font-weight:650;color:var(--ink3);min-width:0}
.tabbar button.on{color:var(--ink)}
.tabbar .t-swim.on{background:color-mix(in srgb,var(--c-swim) 18%,transparent)}.tabbar .t-swim.on svg{color:var(--t-swim)}
.tabbar .t-bike.on{background:color-mix(in srgb,var(--c-bike) 18%,transparent)}.tabbar .t-bike.on svg{color:var(--t-bike)}
.tabbar .t-run.on{background:color-mix(in srgb,var(--c-run) 18%,transparent)}.tabbar .t-run.on svg{color:var(--t-run)}
.tabbar .t-tri.on,.tabbar .t-multi.on{background:color-mix(in srgb,var(--c-tri) 22%,transparent)}.tabbar .t-tri.on svg,.tabbar .t-multi.on svg{color:var(--t-tri)}
.tabbar .t-mehr.on{background:var(--track)}
.remind{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:45;display:none;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:18px;background:var(--card);box-shadow:0 10px 30px -12px rgba(40,25,5,.4),0 0 0 1px var(--line);font-size:13.5px}
.remind.on{display:flex}
.remind>span{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--ink2)}
.remind>span svg{color:var(--t-tri)}
.toast{position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateY(20px);z-index:300;background:var(--ink);color:var(--card);padding:10px 10px 10px 16px;border-radius:16px;font-size:13.5px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast .tbtn{min-height:32px;background:var(--card);color:var(--ink);font-size:13px}
.ovl{position:fixed;inset:0;z-index:250;background:rgba(20,14,6,.4);display:none;align-items:flex-end;justify-content:center}
.ovl.on{display:flex}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s var(--ease)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--neutral);margin:0 auto 12px}
.sheet h3{margin:0 0 10px;font-size:19px}
.sheet p{color:var(--ink2);margin:0 0 12px}
.sheet .tbtn{width:100%}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.ob{position:fixed;inset:0;z-index:280;background:var(--bg);overflow-y:auto;display:flex;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.obc{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px}
.obc h2{margin:6px 0 0;font-family:var(--disp);font-size:30px;font-weight:750;letter-spacing:-.035em;line-height:1.1}
.obb p{margin:0 0 12px;color:var(--ink2)}
.obdots{display:flex;gap:6px}.obdots i{width:22px;height:4px;border-radius:2px;background:var(--track)}.obdots i.on{background:var(--ink)}
.obnav{display:flex;gap:10px;margin-top:8px}.obnav .tbtn{flex:1}
.skip{align-self:center;color:var(--ink3);font-size:13.5px;padding:8px}
.warnbox,.infobox{display:flex;gap:10px;border-radius:16px;padding:14px;margin:0 0 12px}
.warnbox{background:var(--warn-bg);color:var(--warn-t)}.warnbox p{color:inherit;margin:0}
.infobox{background:var(--card);box-shadow:var(--shadow)}.infobox p{margin:0}

/* Auftritt beim Scrollen: Endzustand ist immer sichtbar, die Klasse kommt nur mit JavaScript */
.anim .rv{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .8s var(--ease)}
.anim .rv.in{opacity:1;transform:none}

/* ---------- breitere Bildschirme ---------- */
@media (min-width:640px){
  .igrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .recs{grid-template-columns:repeat(3,minmax(0,1fr))}

  .card{padding:22px;border-radius:26px}
  .lwrap{margin:0 -22px;padding:0 22px}
  .hero{padding:28px 28px 16px}
  .hero h1{font-size:42px}
  .pentry{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,.8fr) 28px}

  .toggles{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:960px){
  .top{padding:12px 24px}
  .dtabs{display:flex;gap:4px;margin-left:24px}

  .dtabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

  .toast{bottom:28px}
  .shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:32px;padding:0 24px}
  .wrap{padding-bottom:70px}
  .chap{display:none}
  .toc{display:block;position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow-y:auto;padding:18px 0}
  .toc .tt{font-size:11.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px 12px}
  .toc a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;font-size:13.5px;font-weight:550;color:var(--ink2);text-decoration:none;position:relative;transition:background .2s,color .2s}
  .toc a::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--neutral);flex:none;transition:background .2s,transform .2s}
  .toc a:hover{background:var(--fill)}
  .toc a.on{background:var(--card);color:var(--ink);font-weight:650;box-shadow:var(--shadow)}
  .toc a.on::before{background:var(--acc);transform:scale(1.4)}
  .shell.notoc{grid-template-columns:minmax(0,1fr);max-width:980px}
  .shell.notoc .toc{display:none}
  .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .grid.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
  .grid .full{grid-column:1/-1}
  .reveal{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:28px;gap:28px}
  .igrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rd{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:8px 32px;align-items:start}
  .rd>:nth-child(1){grid-column:1;grid-row:1}.rd>:nth-child(2){grid-column:1;grid-row:2}.rd>:nth-child(3){grid-column:2;grid-row:1/span 2}

  .balg{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero{padding:34px 36px 18px;border-radius:34px}
  .hero h1{font-size:48px}
  .hgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:28px;align-items:end}

  .chance .big{font-size:76px}
  .recs{grid-template-columns:repeat(4,minmax(0,1fr))}
}

<script>
/* TriLog · Urteil aus Regeln: Befund, sechs Insights, Hinweise je Disziplin, Repair Guide */
(function (TL) {
  'use strict';
  var U = TL.u, M = TL.model, I = TL.insights = {};
  var NAME = { swim: 'Schwimmen', bike: 'Rad', run: 'Laufen' };
  var DAT = { swim: 'dem Schwimmen', bike: 'dem Rad', run: 'dem Laufen' };
  function pct(x) { return U.num(x * 100, 0) + ' %'; }

  /* ---------- Kandidaten für den Befund ---------- */
  function cands(R, triKey, tri) {
    var out = [], share = M.raceShare(triKey, tri), tot = R.h84tot;
    /* Limiter */
    if (tot >= 4) {
      var ratio = {}, worst = null;
      M.SPORTS.forEach(function (s) { ratio[s] = (R.h84[s] / tot) / share[s]; if (!worst || ratio[s] < ratio[worst]) worst = s; });
      var tr = R.h84[worst] / tot, rs = share[worst];
      if (ratio[worst] < 0.8) out.push({
        key: 'limiter', sport: worst, score: (1 - ratio[worst]) * 100, cat: 'Balance', icon: 'tri', target: 'balance', chart: { kind: 'balance', share: share, tot: tot },
        title: worst === 'bike' ? 'Das Rad kommt zu kurz' : worst === 'swim' ? 'Das Schwimmen kommt zu kurz' : 'Das Laufen kommt zu kurz',
        sentence: 'In den letzten zwölf Wochen entfielen ' + pct(tr) + ' deiner Ausdauerstunden auf ' + DAT[worst] + ', im Rennen (' + M.TRI[triKey].name + ') macht es rund ' + pct(rs) + ' der Zeit aus.',
        stats: [[pct(tr), 'Trainingsanteil ' + NAME[worst]], [pct(rs), 'Anteil an der Rennzeit'], [U.num(R.h84[worst], 1) + ' h', 'in 12 Wochen']],
        steps: ['Ausdauerstunden der letzten 84 Tage: Schwimmen ' + U.num(R.h84.swim, 1) + ' h, Rad ' + U.num(R.h84.bike, 1) + ' h, Laufen ' + U.num(R.h84.run, 1) + ' h.', 'Rennanteile ' + share.src + ' für ' + M.TRI[triKey].name + ': Schwimmen ' + pct(share.swim) + ', Rad ' + pct(share.bike) + ', Laufen ' + pct(share.run) + '.', 'Verhältnis Training zu Rennen: ' + M.SPORTS.map(function (s) { return NAME[s] + ' ' + U.num(ratio[s], 2); }).join(', ') + '. Unter 0,8 gilt eine Disziplin als unterversorgt.'],
        value: pct(tr), beleg: pct(tr) + ' Training gegen ' + pct(rs) + ' Rennen', grade: tot >= 10 ? 'belegt' : 'Hinweis'
      });
    }
    /* Lockeres zu hart */
    var RU = R.run;
    if (RU.easyRuns.length >= 4 && RU.zones) {
      var hi = RU.easyHi.length, n = RU.easyRuns.length, medHr = U.median(RU.easyRuns.map(function (u) { return u.hr; }));
      if (hi / n >= 0.4) out.push({
        key: 'easy', sport: 'run', score: hi / n * 100, cat: 'Risiko', icon: 'heart', target: 'run', risk: true,
        title: 'Deine lockeren Läufe sind nicht locker',
        sentence: hi + ' von ' + n + ' lockeren Läufen der letzten zwölf Wochen liefen mit einem Durchschnittspuls in Zone 3 oder höher, der Median lag bei ' + Math.round(medHr) + ' (Zone 3 ab ' + RU.zones[1] + ').',
        stats: [[hi + ' von ' + n, 'lockere Läufe in Zone 3+'], [String(Math.round(medHr)), 'Median-Puls locker'], [String(RU.zones[1]), 'Grenze Zone 3']],
        steps: ['Schwellenpuls ' + RU.lthr + ' (' + RU.lthrSrc + '); Zone 3 beginnt bei 90 % davon, also bei ' + RU.zones[1] + '.', 'Locker heißt: Lauf von 5 bis 22 km, langsamer als dein Marathontempo von ' + U.pace(RU.mp) + ' /km, ohne Qualitätsbegriff im Namen.', 'Gezählt werden die letzten 84 Tage.'],
        value: hi + '/' + n, beleg: 'Median ' + Math.round(medHr) + ' · Zone 3 ab ' + RU.zones[1], grade: n >= 6 ? 'belegt' : 'Hinweis'
      });
    }
    /* Sprung im Umfang (Stunden, alle Ausdauer) */
    var Wk = R.weeks, done = Wk.slice(0, -1);
    for (var i = done.length - 1; i >= 4; i--) {
      var hrs = function (W) { return W.h.swim + W.h.bike + W.h.run; };
      var prev = U.mean(done.slice(i - 4, i).map(hrs)), v = hrs(done[i]);
      if (v >= 4 && prev > 0 && v > prev * 1.3) {
        var age = R.today - done[i].start;
        if (age <= 42) out.push({
          key: 'jump', score: Math.min(90, (v / prev - 1) * 60) * (age <= 21 ? 1 : 0.6), cat: 'Risiko', icon: 'warn', target: 'weeks', risk: true,
          title: 'Dein Umfang ist zu schnell gestiegen',
          sentence: 'Die Woche ab ' + U.de(done[i].start) + ' hatte ' + U.num(v, 1) + ' Ausdauerstunden, ' + U.num((v / prev - 1) * 100, 0) + ' % mehr als der Schnitt der vier Wochen davor (' + U.num(prev, 1) + ' h).',
          stats: [[U.num(v, 1) + ' h', 'Woche ab ' + U.de(done[i].start, true)], [U.num(prev, 1) + ' h', 'Schnitt 4 Wochen davor'], ['+' + U.num((v / prev - 1) * 100, 0) + ' %', 'Sprung']],
          steps: ['Ausdauerstunden je Woche (Montag bis Sonntag), Schwimmen, Rad und Laufen zusammen.', 'Als Sprung zählt eine abgeschlossene Woche ab 4 Stunden, die mehr als 30 % über dem Schnitt der vier Wochen davor liegt.', 'Berücksichtigt wird nur die jüngste solche Woche der letzten sechs Wochen.'],
          value: '+' + U.num((v / prev - 1) * 100, 0) + ' %', beleg: U.num(v, 1) + ' h gegen ' + U.num(prev, 1) + ' h', grade: 'belegt'
        });
        break;
      }
    }
    /* Form sehr tief */
    if (R.form.form < -25) out.push({
      key: 'form', score: Math.min(95, -R.form.form * 2), cat: 'Risiko', icon: 'gauge', target: 'formcard', risk: true,
      title: 'Du bist gerade sehr belastet',
      sentence: 'Deine Form liegt bei ' + U.num(R.form.form, 0, true) + ': Die Ermüdung (' + U.num(R.form.fat, 0) + ') übersteigt die Fitness (' + U.num(R.form.fit, 0) + ') deutlich.',
      stats: [[U.num(R.form.form, 0, true), 'Form'], [U.num(R.form.fat, 0), 'Ermüdung'], [U.num(R.form.load7, 0), 'Punkte in 7 Tagen']],
      steps: ['Fitness: gleitender Schnitt der Tageslast über 42 Tage.', 'Ermüdung: gleitender Schnitt über 7 Tage.', 'Form = Fitness minus Ermüdung am Ende des Tages.'],
      value: U.num(R.form.form, 0, true), beleg: 'Fitness ' + U.num(R.form.fit, 0) + ' · Ermüdung ' + U.num(R.form.fat, 0), grade: 'belegt'
    });
    return out;
  }

  /* ---------- Befund und sechs Insights für die Triathlon-Ansicht ---------- */
  I.tri = function (R, triKey, tri) {
    var C = cands(R, triKey, tri).sort(function (a, b) { return b.score - a.score; });
    var bef = C[0] || {
      key: 'clean', score: 0, icon: 'check', target: 'formcard',
      title: 'Dein Training ist sauber verteilt',
      sentence: 'Keine Disziplin ist deutlich unterversorgt, kein Umfangssprung und keine überhöhte Ermüdung in den letzten Wochen.',
      stats: [[U.num(R.h84tot, 1) + ' h', 'Ausdauer in 12 Wochen'], [U.num(R.form.form, 0, true), 'Form'], [R.form.acwr ? U.num(R.form.acwr, 2) : '–', 'akut zu chronisch']],
      steps: ['Geprüft: Verteilung der Ausdauerstunden gegen die Rennanteile.', 'Geprüft: Wochensprünge über 30 % und Form unter −25.', 'Geprüft: Puls der lockeren Läufe.']
    };
    var used = {}; used[bef.key] = 1;
    var items = [];
    /* Fortschritt: VDOT jetzt gegen vor einem halben Jahr, sonst Rad- oder Schwimmeffizienz */
    (function () {
      var runs = R.units.filter(function (u) { return u.vdot && u.km >= 3; });
      var old = runs.filter(function (u) { return u.d <= R.today - 150 && u.d > R.today - 330; }).sort(function (a, b) { return b.vdot - a.vdot; })[0];
      if (R.run.vdot && old) {
        var dv = Math.round(R.run.vdot * 10) / 10 - Math.round(old.vdot * 10) / 10;
        items.push({ cat: 'Fortschritt', icon: 'trend', target: 'run', title: dv > 0.4 ? 'Dein Laufen wird schneller' : dv < -0.4 ? 'Deine Laufform ist gesunken' : 'Laufleistung stabil', value: U.num(dv, 1, true), sentence: 'Dein bester VDOT lag vor fünf bis elf Monaten bei ' + U.num(old.vdot, 1) + ', in den letzten 150 Tagen bei ' + U.num(R.run.vdot, 1) + '.', beleg: U.num(old.vdot, 1) + ' → ' + U.num(R.run.vdot, 1) + ' · VDOT', grade: 'belegt', risk: dv < -0.4 });
      } else if (R.swim.paceM.length >= 2) {
        var p = R.swim.paceM, d = p[p.length - 1].v - p[0].v;
        items.push({ cat: 'Fortschritt', icon: 'swim', target: 'swim', title: d < 0 ? 'Du schwimmst schneller' : 'Schwimmtempo noch ohne Fortschritt', value: U.num(d, 0, true) + ' s', sentence: 'Dein Median-Tempo im Becken lag ' + U.monthLabel(p[0].m) + ' bei ' + U.pace(p[0].v) + ' /100 m, zuletzt bei ' + U.pace(p[p.length - 1].v) + '.', beleg: 'Beckeneinheiten ab 400 m', grade: 'Hinweis' });
      } else items.push({ cat: 'Fortschritt', icon: 'trend', target: 'run', title: 'Noch kein Verlauf messbar', value: '–', sentence: 'Für einen Vorher-nachher-Vergleich braucht TriLog Läufe ab 3 km aus zwei Zeiträumen.', beleg: 'zu wenig Daten', grade: 'Hinweis' });
    })();
    /* Risiko */
    var risk = C.filter(function (c) { return c.cat === 'Risiko' && !used[c.key]; })[0];
    if (risk) { used[risk.key] = 1; items.push(risk); }
    else items.push({ cat: 'Risiko', icon: 'gauge', target: 'formcard', title: R.form.acwr && R.form.acwr > 1.3 ? 'Belastung steigt gerade an' : 'Belastung im grünen Bereich', value: R.form.acwr ? U.num(R.form.acwr, 2) : '–', sentence: 'Die letzten 7 Tage brachten ' + U.num(R.form.load7, 0) + ' Punkte, das Verhältnis zum Schnitt der 4 Wochen davor liegt bei ' + (R.form.acwr ? U.num(R.form.acwr, 2) : '–') + '.', beleg: 'akut zu chronisch · Zielbereich 0,8–1,3', grade: 'belegt', risk: R.form.acwr > 1.5 });
    /* Rennen */
    (function () {
      var race = R.nextRace;
      if (race && race.kind === 'tri' && tri && tri.total) items.push({ cat: 'Rennen', icon: 'flag', target: 'race', title: race.goal ? 'Ziel in ' + race.name + ': ' + I.chanceWord(tri.chance) : 'Prognose für ' + race.name, value: race.goal ? tri.chance + ' %' : U.time(tri.total), sentence: 'Am Renntag liegst du bei etwa ' + U.time(tri.total) + (race.goal ? ', ' + I.gapTxt(tri.total, race.goal) + ' Ziel von ' + U.time(race.goal) : '') + '. Streuung ± ' + U.time(tri.sd) + '.', beleg: U.num(R.realToday <= U.dn(race.date) ? U.dn(race.date) - R.realToday : 0, 0) + ' Tage bis zum Start', grade: 'belegt' });
      else if (race && race.kind === 'run' && R.run.vdot && !race.goalBad) { var rr = M.runRace(R, race.dist, race.goal, race, race.wx); items.push({ cat: 'Rennen', icon: 'flag', target: 'run', title: race.goal ? 'Ziel in ' + race.name + ': ' + I.chanceWord(rr.chance) : 'Prognose für ' + race.name, value: race.goal ? rr.chance + ' %' : U.time(rr.rt), sentence: 'Am Renntag liegst du bei etwa ' + U.time(rr.rt) + ' für ' + M.RUNDIST[race.dist].name + (race.goal ? ', ' + I.gapTxt(rr.rt, race.goal) + ' Ziel von ' + U.time(race.goal) : '') + '.', beleg: 'Streuung ± ' + U.time(rr.sd), grade: 'belegt' }); }
      else if (race && race.goalBad) items.push({ cat: 'Rennen', icon: 'warn', risk: true, target: 'race', title: 'Zielzeit prüfen', value: U.time(race.goalBad), sentence: 'Für ' + race.name + ' ist als Ziel ' + U.time(race.goalBad) + ' eingetragen. Das ist für diese Distanz unrealistisch kurz, vermutlich fehlen die Stunden. Bitte unter „Mehr → Rennen“ als h:mm:ss eintragen, z. B. 1:40:00.', beleg: 'Format h:mm:ss', grade: 'Hinweis' });
      else if (tri && tri.missing.length) items.push({ cat: 'Rennen', icon: 'flag', target: 'race', title: 'Prognose noch unvollständig', value: (3 - tri.missing.length) + '/3', sentence: 'Für eine ' + M.TRI[triKey].name + '-Prognose fehlt noch: ' + tri.missing.map(function (m) { return NAME[m[0]]; }).join(', ') + '.', beleg: 'Disziplinen mit Prognose', grade: 'Hinweis' });
      else if (tri && tri.total) items.push({ cat: 'Rennen', icon: 'flag', target: 'race', title: M.TRI[triKey].name + ' heute', value: U.time(tri.total), sentence: 'Würdest du heute starten, liegt deine Zielzeit bei rund ' + U.time(tri.total) + '.', beleg: 'Streuung ± ' + U.time(tri.sd), grade: 'belegt' });
    })();
    /* Konstanz: Wochen mit allen drei Disziplinen */
    (function () {
      var last6 = R.weeks.slice(-7, -1), all3 = last6.filter(function (W) { return W.nd.swim && W.nd.bike && W.nd.run; }).length;
      var all52 = R.weeks.slice(0, -1).filter(function (W) { return W.nd.swim && W.nd.bike && W.nd.run; }).length;
      items.push({ cat: 'Konstanz', icon: 'calendar', target: 'weeks', title: all3 >= 4 ? 'Alle drei Disziplinen regelmäßig' : 'Selten alle drei in einer Woche', value: all3 + '/6', sentence: 'In ' + all3 + ' der letzten 6 Wochen hast du geschwommen, bist Rad gefahren und gelaufen, in 52 Wochen ' + all52 + '-mal.', beleg: 'Wochen mit allen drei Disziplinen', grade: 'belegt' });
    })();
    /* Gewohnheit */
    (function () {
      var en = R.units.filter(function (u) { return u.d >= R.today - 364 && M.SPORTS.indexOf(u.sport) >= 0; });
      if (!en.length) return;
      var g = {}; en.forEach(function (u) { var k = U.wday(u.d) + '-' + u.hour; g[k] = (g[k] || 0) + 1; });
      var top = Object.keys(g).sort(function (a, b) { return g[b] - g[a]; })[0].split('-');
      var pre9 = en.filter(function (u) { return u.hour < 9; }).length / en.length;
      items.push({ cat: 'Gewohnheit', icon: 'clock', target: 'habit', title: pre9 > 0.5 ? 'Du trainierst früh' : pre9 < 0.1 ? 'Du trainierst fast nie früh' : 'Gemischte Trainingszeiten', value: pct(pre9), sentence: U.num(pre9 * 100, 0) + ' % deiner Ausdauereinheiten begannen vor 9 Uhr, am häufigsten startest du ' + U.WDL[+top[0]].toLowerCase() + 's um ' + top[1] + ' Uhr.', beleg: en.length + ' Einheiten in 12 Monaten', grade: 'belegt' });
    })();
    /* Balance (Limiter) oder Koppeln */
    var lim = C.filter(function (c) { return c.key === 'limiter' && !used.limiter; })[0];
    if (lim) items.push(lim);
    else {
      var b84 = R.bricks.filter(function (b) { return b.run.d > R.today - 84; }).length;
      items.push({ cat: 'Balance', icon: 'brick', target: 'balance', title: b84 ? 'Koppeleinheiten im Training' : 'Noch keine Koppeleinheiten', value: String(b84), sentence: b84 ? b84 + ' Läufe in den letzten zwölf Wochen begannen direkt nach einer Radeinheit.' : 'In den letzten zwölf Wochen begann kein Lauf direkt nach einer Radeinheit. Koppeln gewöhnt die Beine an den Wechsel.', beleg: 'Lauf ≤ 20 min nach Radende', grade: b84 ? 'belegt' : 'Hinweis' });
    }
    return { befund: bef, items: items.slice(0, 6) };
  };

  /* ---------- Repair Guide: Plan der Woche prüfen ---------- */
  I.repair = function (plan, R) {
    var days = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return (plan[i] || []); });
    function hard(e) { return e.kind === 'hart'; } function key(e) { return e.kind === 'lang' || e.kind === 'koppel'; }
    var hardDays = days.map(function (d) { return d.some(hard); }), keyDays = days.map(function (d) { return d.some(key); });
    /* harte Einheit direkt vor einer Schlüsseleinheit */
    for (var i = 0; i < 6; i++) {
      if (hardDays[i] && keyDays[i + 1]) {
        var e = days[i].filter(hard)[0], k = days[i + 1].filter(key)[0];
        return { day: i, entry: e, to: 'locker', title: 'Ich mache den ' + U.WDL[i] + ' leicht, damit der ' + U.WDL[i + 1] + ' gelingt', reason: 'Am ' + U.WDL[i] + ' steht eine harte Einheit (' + NAME[e.sport] + '), direkt danach am ' + U.WDL[i + 1] + ' die Schlüsseleinheit (' + NAME[k.sport] + ', ' + (k.kind === 'koppel' ? 'Koppel' : 'lang') + '). Deine Form liegt bei ' + U.num(R.form.form, 0, true) + '. Zwei Reize hintereinander drücken die Qualität der wichtigeren Einheit.', keep: 'Die Schlüsseleinheit bleibt unverändert.' };
      }
    }
    /* zwei harte Tage hintereinander */
    for (i = 0; i < 6; i++) if (hardDays[i] && hardDays[i + 1]) {
      var e2 = days[i + 1].filter(hard)[0];
      return { day: i + 1, entry: e2, to: 'locker', title: 'Ich entzerre die harten Tage', reason: U.WDL[i] + ' und ' + U.WDL[i + 1] + ' sind beide hart geplant. Die zweite Einheit startet mit vorbelasteten Beinen, deine Form liegt bei ' + U.num(R.form.form, 0, true) + '.', keep: 'Die erste harte Einheit bleibt, die zweite wird locker.' };
    }
    var nh = hardDays.filter(Boolean).length;
    return { day: null, title: 'Deine Woche passt', reason: nh ? nh + ' harte Tage, keiner direkt vor einer Schlüsseleinheit und keine zwei harten Tage hintereinander.' : 'Kein harter Tag geplant. Für Fortschritt helfen ein bis zwei gezielte harte Einheiten pro Woche.', keep: '' };
  };

  /* ---------- Kurzhinweise je Disziplin ---------- */
  I.sport = function (R, s) {
    var out = [];
    if (s === 'run') {
      var RU = R.run;
      if (RU.easyRuns.length) out.push(['heart', RU.easyHi.length + ' von ' + RU.easyRuns.length + ' lockeren Läufen in Zone 3 oder höher', RU.easyHi.length / RU.easyRuns.length >= 0.4]);
      if (RU.hard.length) out.push(['bolt', RU.hardOver.length + ' von ' + RU.hard.length + ' harten Einheiten über dem Schwellenpuls', RU.hardOver.length > 0]);
      if (RU.easy) out.push(['run', 'Lockeres Tempo für dich: ' + U.pace(RU.easy[0]) + '–' + U.pace(RU.easy[1]) + ' /km', false]);
    }
    if (s === 'bike') {
      var BI = R.bike;
      if (!BI.ready) out.push(['info', 'Für Prognosen fehlt noch ' + BI.need, false]);
      if (BI.powerMode && BI.ftp && BI.ftpSrc.indexOf('geschätzt') === 0) out.push(['bolt', 'Die FTP ist aus einer Fahrt geschätzt. Ein 20-Minuten-Test oder ein Eintrag unter Mehr → Profil macht sie genau.', false]);
      if (R.assumed.weight) out.push(['info', 'Gewicht angenommen (75 kg). Trag es unter Mehr → Profil ein, dann stimmen W/kg und Radprognose.', false]);
      if (!BI.powerMode) out.push(['bolt', 'Ohne Wattmessung ist die Radprognose rund doppelt so unsicher. Ein Powermeter oder ein 20-Minuten-Test macht sie genauer.', false]);
      var b84 = R.bricks.filter(function (b) { return b.run.d > R.today - 84; }).length; out.push(['brick', b84 + ' Koppelläufe in 12 Wochen', false]);
    }
    if (s === 'swim') {
      var SW = R.swim, sw = R.units.filter(function (u) { return u.sport === 'swim' && u.d > R.today - 84; });
      if (!SW.ready) out.push(['info', 'Für Prognosen fehlt noch ' + SW.need, false]);
      if (SW.css && SW.cssSrc.indexOf('geschätzt') === 0) out.push(['drop', 'Die CSS ist aus dem Training geschätzt, egal ob Brust oder Kraul. Ein 400/200-m-Kraultest (Mehr → Profil) macht sie genau.', false]);
      out.push(['swim', sw.length + ' Einheiten in 12 Wochen, ' + sw.filter(function (u) { return u.sub === 'open'; }).length + ' im Freiwasser', false]);
    }
    return out;
  };
})(window.TL = window.TL || {});

</script>
<script>
/* TriLog · Befund und Beobachtungen je Disziplin, aus Regeln über deine Daten */
(function (TL) {
  'use strict';
  var U = TL.u, M = TL.model, I = TL.insights;
  var num = U.num;
  function pct(x) { return num(x * 100, 0) + ' %'; }
  function sdiff(a, b) { return Math.round(a) - Math.round(b); }

  /* Ausrüstung: der kritischste Gegenstand einer Sportart */
  I.gearItem = function (R, sport) {
    var g = (R.gearActive || []).filter(function (x) { return !sport || x.sport === sport; }).sort(function (a, b) { var o = { due: 0, warn: 1, ok: 2 }; return o[a.state] - o[b.state] || (b.km / (b.max || 1e9)) - (a.km / (a.max || 1e9)); })[0];
    if (!g) return { cat: 'Material', icon: sport === 'swim' ? 'drop' : sport === 'bike' ? 'bike' : 'shoe', target: 'material', title: 'Ausrüstung noch nicht angelegt', value: '–', sentence: 'Leg unter „Mehr → Ausrüstung“ deine ' + (sport === 'bike' ? 'Räder, Ketten und Reifen' : sport === 'swim' ? 'Neoprenanzüge' : 'Laufschuhe') + ' an. TriLog zählt dann die Kilometer und erinnert dich rechtzeitig an den Wechsel.', beleg: 'Garmin liefert keine Ausrüstung mit', grade: 'Hinweis' };
    if (g.type === 'wetsuit') return { cat: 'Material', icon: 'drop', target: 'material', title: g.state === 'due' ? g.name + ' prüfen' : g.name + ' im Einsatz', value: num(g.years, 1) + ' J.', sentence: g.name + ' ist seit ' + num(g.years, 1) + ' Jahren in Gebrauch' + (g.state === 'due' ? '. Nach rund vier Saisons lohnt ein Blick auf Nähte, Risse und Passform.' : ', ' + g.n + ' Freiwassereinheiten bisher.'), beleg: 'Richtwert: Prüfung nach 4 Jahren', grade: 'Hinweis', risk: g.state === 'due' };
    var left = g.max ? g.max - g.km : null;
    return { cat: 'Material', icon: g.type === 'shoe' ? 'shoe' : 'bike', target: 'material', risk: g.state !== 'ok',
      title: g.state === 'due' ? g.name + ': Austausch fällig' : g.state === 'warn' ? g.name + ' bald tauschen' : g.name + ' hält noch',

  function empty(root) {

    var c = el('section', { cls: 'card emptyc' });
    c.innerHTML = '<div class="mark big" aria-hidden="true"><i class="s-swim"></i><i class="s-bike"></i><i class="s-run"></i></div><p>Importiere deinen Garmin-Export, dann rechnet TriLog Form, Prognosen und Zonen für Schwimmen, Rad und Laufen.</p>';
    c.appendChild(V.btn('Garmin-CSV importieren', 'upload', pick, 'primary'));
    c.appendChild(V.btn('Sicherung laden', 'save', function () { A.openMore('daten'); }));
    root.appendChild(c);
  }
  function pick() { var fi = el('input', { type: 'file', accept: '.csv,text/csv' }); fi.onchange = function () { if (fi.files[0]) A.importFile(fi.files[0]); }; fi.click(); }
  A.pick = pick;

  /* ---------- Navigation aus Insights ---------- */
  A.go = function (target) {
    if (['swim', 'bike', 'run'].indexOf(target) >= 0) { if (validView(target)) A.show(target); return; }
    var alias = { eff: ['perf', 'tech'], formcard: ['form'], dyn: ['dyn', 'perf'], tech: ['tech'], material: ['material'] };
    var t = U.$(target); if (!t) (alias[target] || []).some(function (a) { t = U.$(a); return !!t; }); if (!t) return;
    t.scrollIntoView({ behavior: U.MOTION ? 'smooth' : 'auto', block: 'start' });
    t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');
  };
  A.openMore = function (section) { st.moreSection = section; A.show('mehr'); };
  A.state = st;

  /* ---------- Erklärung als Blatt ---------- */
  A.explain = function (key) {
    var g = TL.GLOSSAR[key]; if (!g) return;
    var ov = U.$('sheet'); U.clear(ov);
    var s = el('div', { cls: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': g[0] });
    s.innerHTML = '<div class="grab"></div><h3>' + esc(g[0]) + '</h3><p><b>Was wird gemessen?</b><br>' + esc(g[1]) + '</p><p><b>Wozu dient es?</b><br>' + esc(g[2]) + '</p>';
    var x = el('button', { cls: 'tbtn press primary', type: 'button', text: 'Verstanden' }); x.onclick = close; s.appendChild(x);
    ov.appendChild(s); ov.classList.add('on'); setTimeout(function () { x.focus(); }, 30);
    ov.onclick = function (e) { if (e.target === ov) close(); };
    function close() { ov.classList.remove('on'); }
  };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { var o = U.$('sheet'); if (o) o.classList.remove('on'); } });

  /* ---------- Import ---------- */
  A.importFile = function (file) {
    file.text().then(function (t) {
      var res;
      try { res = TL.importCSV(t); } catch (e) { U.toast(e.message); return; }
      var m = TL.store.merge(res.units);
      if (!m.saved) { U.toast('Speichern im Browser nicht möglich. Ist privates Surfen aktiv?'); return; }
      var meta = TL.store.meta(); meta.onboarded = true; TL.store.setMeta(meta);
      quietUntil = Date.now() + 8000; compute(); if (st.view === 'mehr' && !U.$('ob')) st.view = null; A.render();
      U.toast(m.added + ' neue Einheiten importiert, ' + m.total + ' insgesamt.', ['Jetzt sichern', S.saveBackup]);
      closeOnboarding();
    });
  };

  /* ---------- Erinnerung an die Sicherung ---------- */
  var quietUntil = 0;
  function reminder() {
    if (Date.now() < quietUntil) { U.$('remind').classList.remove('on'); return; }
    var bar = U.$('remind'), m = TL.store.meta(), b = S.backupState();
    var dismissed = false; try { dismissed = sessionStorage.getItem('trilog.remind') === '1'; } catch (e) {}
    var stale = b.cls === 'due' && m.lastChange && (Date.now() - m.lastChange > 3 * 864e5 || !m.lastBackup);
    if (!stale || dismissed || st.view === 'mehr') { bar.classList.remove('on'); return; }
    U.clear(bar);
    bar.appendChild(el('span', null, U.ico('save', 17) + '<span>' + esc(b.text.replace(/^./, function (c) { return c.toUpperCase(); })) + '. Jetzt sichern?</span>'));
    var y = el('button', { cls: 'tbtn primary press small', type: 'button', text: 'Sichern' }); y.onclick = function () { S.saveBackup(); bar.classList.remove('on'); };
    var n = el('button', { cls: 'ibtn press', type: 'button', 'aria-label': 'Später' }, U.ico('x', 15)); n.onclick = function () { try { sessionStorage.setItem('trilog.remind', '1'); } catch (e) {} bar.classList.remove('on'); };
    bar.appendChild(y); bar.appendChild(n); bar.classList.add('on');
  }

  /* ---------- Onboarding ---------- */
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  A.onboarding = function (force) {
    var meta = TL.store.meta();
    if (!force && meta.onboarded) return;
    var ov = el('div', { cls: 'ob', id: 'ob', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Willkommen bei TriLog' });
    var steps = [
      { t: 'Willkommen bei TriLog', b: '<div class="mark big"><i class="s-swim"></i><i class="s-bike"></i><i class="s-run"></i></div><p>Das Logbuch für Schwimmen, Rad und Laufen. TriLog liest deinen Garmin-Export, rechnet Form, Zonen und Prognosen und zeigt dir, welche Disziplin dich gerade am meisten Zeit kostet.</p><p class="muted">Alles bleibt auf diesem Gerät. Es gibt kein Konto und keinen Server mit deinen Daten.</p>' },
      { t: 'Wichtig: Speicherort', b: '<p>Deine Daten liegen im Browser dieses Geräts.</p>' + (isIOS && !standalone ? '<div class="warnbox">' + U.ico('warn', 18) + '<p><b>Am iPhone:</b> Safari löscht gespeicherte Daten einer Webseite, wenn du sie sieben Tage nicht öffnest. Leg TriLog auf den Home-Bildschirm, dann bleibt alles erhalten:<br>Teilen-Symbol → „Zum Home-Bildschirm“.</p></div>' : '<div class="infobox">' + U.ico('info', 18) + '<p>Wenn du den Browserverlauf löschst, sind auch deine TriLog-Daten weg. Am iPhone löscht Safari sie außerdem nach sieben Tagen ohne Besuch, außer TriLog liegt auf dem Home-Bildschirm.</p></div>') + '<p>Der Punkt neben dem Speichersymbol oben zeigt, ob deine letzten Änderungen gesichert sind: grün gesichert, gelb offen.</p>' },
      { t: 'Deine Daten', b: '<p>Exportiere deine Aktivitäten aus Garmin Connect am Rechner: Aktivitäten → Alle Aktivitäten → nach unten scrollen bis 12 Monate geladen sind → „CSV exportieren“.</p><p class="muted">Deutsche und englische Exporte funktionieren. Welche Uhr du nutzt, ist egal.</p>', import: true },
      { t: 'Kurz zu dir', b: '<p>Drei Angaben machen die Rechnung genauer. Alles ist optional und später unter „Mehr → Profil“ änderbar.</p>', profile: true }
    ];
    var i = 0, card = el('div', { cls: 'obc' }); ov.appendChild(card); document.body.appendChild(ov);
    function draw() {
      var s = steps[i]; U.clear(card);
      card.appendChild(el('div', { cls: 'obdots' }, steps.map(function (_, k) { return '<i class="' + (k === i ? 'on' : '') + '"></i>'; }).join('')));
      card.appendChild(el('h2', { text: s.t }));
      card.appendChild(el('div', { cls: 'obb' }, s.b));
      if (s.import) { card.appendChild(V.btn('Garmin-CSV auswählen', 'upload', pick, 'primary')); if (TL.store.units().length) card.appendChild(el('p', { cls: 'foot', text: TL.store.units().length + ' Einheiten sind bereits geladen.' })); }
      if (s.profile) {
        var p = TL.store.profile(), g = el('div', { cls: 'fgrid' });
        g.innerHTML = '<label class="field"><span class="fl">Vorname</span><input id="ob-name" type="text" autocomplete="given-name" value="' + esc(p.name || '') + '"></label><label class="field"><span class="fl">Gewicht in kg</span><input id="ob-weight" type="number" inputmode="decimal" value="' + esc(p.weight || '') + '"></label><label class="field"><span class="fl">Ruhepuls</span><input id="ob-rest" type="number" inputmode="numeric" placeholder="50" value="' + esc(p.rest || '') + '"></label>';
        card.appendChild(g);
      }
      var nav = el('div', { cls: 'obnav' });
      if (i > 0) { var bk = el('button', { cls: 'tbtn press', type: 'button', text: 'Zurück' }); bk.onclick = function () { i--; draw(); }; nav.appendChild(bk); }
      var nx = el('button', { cls: 'tbtn primary press', type: 'button', text: i < steps.length - 1 ? 'Weiter' : 'Los geht’s' });
      nx.onclick = function () {
        if (steps[i].profile) { var p = TL.store.profile(); p.name = U.$('ob-name').value.trim(); p.weight = parseFloat(U.$('ob-weight').value) || p.weight || null; p.rest = parseFloat(U.$('ob-rest').value) || p.rest || null; TL.store.setProfile(p); }
        if (i < steps.length - 1) { i++; draw(); } else { var m = TL.store.meta(); m.onboarded = true; TL.store.setMeta(m); closeOnboarding(); A.reload(); }
      };
      nav.appendChild(nx); card.appendChild(nav);
      var sk = el('button', { cls: 'skip press', type: 'button', text: 'Überspringen' }); sk.onclick = function () { var m = TL.store.meta(); m.onboarded = true; TL.store.setMeta(m); closeOnboarding(); A.reload(); }; card.appendChild(sk);
    }
    draw();
  };
  function closeOnboarding() { var o = U.$('ob'); if (o) o.remove(); }

  /* ---------- Ort suchen und Rennwetter holen (Open-Meteo, ohne Schlüssel) ---------- */
  var online = /^(https?:|file:)$/.test(location.protocol) && window.fetch;
  function timeoutFetch(url, ms) { var c = window.AbortController ? new AbortController() : null, t = setTimeout(function () { c && c.abort(); }, ms || 8000); return fetch(url, c ? { signal: c.signal } : {}).then(function (r) { clearTimeout(t); if (!r.ok) throw new Error(r.status); return r.json(); }); }
  A.geocode = function (race) {
    if (!online) { A.reload('mehr'); return; }
    timeoutFetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&name=' + encodeURIComponent(race.ort)).then(function (j) {
      var g = j && j.results && j.results[0]; if (!g) { U.toast('Ort „' + race.ort + '“ nicht gefunden. Das Rennen rechnet ohne Wetter.'); return; }
      var list = TL.store.races(); list.forEach(function (r) { if (r.id === race.id) { r.lat = Math.round(g.latitude * 100) / 100; r.lon = Math.round(g.longitude * 100) / 100; delete r.wx; } }); TL.store.setRaces(list);
    }).catch(function () {}).then(function () { A.reload('mehr'); weather(); });
  };
  function weather() {
    if (!online) return;
    var today = U.todayLocal();
    TL.store.races().filter(function (r) { return r.lat && U.dn(r.date) >= today && U.dn(r.date) - today <= 366; }).forEach(function (r) {
      var ahead = U.dn(r.date) - today, fc = ahead <= 14;
      if (r.wx && r.wx.at === U.ds(today) && (r.wx.src === 'Vorhersage') === fc) return;
      var y = new Date().getFullYear(), url = fc ? 'https://api.open-meteo.com/v1/forecast?latitude=' + r.lat + '&longitude=' + r.lon + '&daily=temperature_2m_max,dew_point_2m_mean&timezone=auto&forecast_days=16'
        : 'https://archive-api.open-meteo.com/v1/archive?latitude=' + r.lat + '&longitude=' + r.lon + '&start_date=' + (y - 20) + '-01-01&end_date=' + (y - 1) + '-12-31&daily=temperature_2m_max,dew_point_2m_mean&timezone=auto';
      timeoutFetch(url).then(function (j) {
        var d = j && j.daily; if (!d || !d.time) return; var tm, td, src;
        if (fc) { var i = d.time.indexOf(r.date); if (i < 0 || d.temperature_2m_max[i] == null) return; tm = d.temperature_2m_max[i]; td = d.dew_point_2m_mean[i]; src = 'Vorhersage'; }
        else { var mm = +r.date.slice(5, 7) - 1, dd = +r.date.slice(8, 10), a = 0, b = 0, n = 0; d.time.forEach(function (t, k) { var yy = +t.slice(0, 4); if (Math.abs(U.dn(t) - Date.UTC(yy, mm, dd) / 864e5) <= 3 && d.temperature_2m_max[k] != null && d.dew_point_2m_mean[k] != null) { a += d.temperature_2m_max[k]; b += d.dew_point_2m_mean[k]; n++; } }); if (!n) return; tm = a / n; td = b / n; src = 'Mittel ' + (y - 20) + '–' + (y - 1); }
        var list = TL.store.races(); list.forEach(function (x) { if (x.id === r.id) x.wx = { tmax: Math.round(tm * 10) / 10, td: Math.round(td * 10) / 10, src: src, at: U.ds(today) }; });
        try { localStorage.setItem('trilog.v1.races', JSON.stringify(list)); } catch (e) {}
        compute(); A.render(true);
      }).catch(function () {});
    });
  }

  /* ---------- Start ---------- */
  var rT, lastW = innerWidth; window.addEventListener('resize', function () { if (Math.abs(innerWidth - lastW) < 2) return; lastW = innerWidth; clearTimeout(rT); rT = setTimeout(function () { V.redraw(); }, 150); });
  document.addEventListener('scroll', U.hideTip, { passive: true });
  A.start = function () {
    if (!TL.store.ok) { U.$('view').appendChild(el('div', { cls: 'card' }, '<h3>Speichern nicht möglich</h3><p class="muted">Dieser Browser erlaubt TriLog keinen lokalen Speicher, zum Beispiel im privaten Modus. Öffne TriLog in einem normalen Fenster.</p>')); return; }
    compute(); A.render(); A.onboarding(false); setTimeout(weather, 800);
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  };
})(window.TL = window.TL || {});

</script>
<script>TL.app.start();</script>
