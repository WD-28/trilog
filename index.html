<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TriLog</title>
<meta name="description" content="TriLog – das Logbuch für Schwimmen, Rad und Laufen. Liest deinen Garmin-Export und rechnet alles im Browser.">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TriLog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/trilog.css">
<script>try{var t=localStorage.getItem('trilog.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap"><div id="view"></div></main>
<nav class="tabbar" id="tabbar" aria-label="Ansichten"></nav>
<div class="remind" id="remind" role="status"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="ovl" id="sheet"></div>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/model.js"></script>
<script src="js/glossar.js"></script>
<script src="js/insights.js"></script>
<script src="js/charts.js"></script>
<script src="js/views.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
<script>TL.app.start();</script>
</body>
</html>
